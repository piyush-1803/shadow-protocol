name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  release:
    name: Publish verified alpha source
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo 'This workflow only publishes explicitly versioned alpha releases.'
            exit 0
          fi
          notes="docs/releases/$tag.md"
          test -f "$notes"
          existing=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == 'false' ]]; then
            echo "Published $tag already exists; keeping its tag and assets unchanged."
            exit 0
          fi
          mkdir -p release
          asset="shadow-protocol-$tag-source.zip"
          git archive --format=zip --prefix="shadow-protocol-$tag/" --output="release/$asset" HEAD
          (cd release && sha256sum "$asset" > SHA256SUMS.txt)
          if [[ "$existing" != 'true' ]]; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Shadow Protocol $tag — Field Build" --notes-file "$notes"
          fi
          gh release upload "$tag" "release/$asset" release/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
