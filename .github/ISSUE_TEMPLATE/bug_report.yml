name: Bug report
description: Report a reproducible game, GPS, map, or synchronization issue.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Do not include room codes, exact GPS coordinates, session cookies, or information identifying players. Report security vulnerabilities privately; see SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser and release version
      placeholder: Android / Chrome / v0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Redacted logs or screenshots
      description: GPS accuracy category and match phase are useful. Remove sensitive location and identity data.
